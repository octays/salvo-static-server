[package]
name = "salvo-static-server"
version = "1.0.1"
edition = "2024"

[[bin]]
name = "static-server"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
salvo = { version= "0.92.2", features = ["quinn", "serve-static", "acme", "rustls", "logging", "compression"] }
tokio = "1.53.2"
tracing-subscriber = "0.3.23"

[dev-dependencies]
salvo = { version = "0.92.2", features = ["test"] }
