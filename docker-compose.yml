services:
  # Development environment
  app-dev:
    build: .
    container_name: salvo-static-dev
    ports:
      - "8080:8080"
    volumes:
      - ./static:/app/static
      - ./temp:/app/temp
    environment:
      - RUST_LOG=debug
    command: ["static-server", "--http-addr", "0.0.0.0:8080", "--log-level", "debug"]
    profiles:
      - dev

  # Production environment
  app-prod:
    build: .
    container_name: salvo-static-prod
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./static:/app/static:ro
      - ./temp:/app/temp
      - letsencrypt:/app/temp/letsencrypt
    environment:
      - RUST_LOG=info
    command: 
      - "static-server"
      - "--http-addr"
      - "0.0.0.0:8080"
      - "--https-addr"
      - "0.0.0.0:8443"
      - "--https-enable"
      - "--acme-domain"
      - "${DOMAIN:-localhost}"
      - "--force-https"
      - "--https-redirect-port"
      - "443"

    restart: unless-stopped
    profiles:
      - prod

volumes:
  letsencrypt:
    driver: local
